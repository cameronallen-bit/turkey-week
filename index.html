  const publicJwk=await crypto.subtle.exportKey('jwk',pair.publicKey);
  const privateJwk=await crypto.subtle.exportKey('jwk',pair.privateKey);
  return {publicJwk,lockedKey:await encrypt(await aesKey(secret),privateJwk)};
}
async function unlock(meta,secret) {
  if(!validKey(secret) || !meta?.lockedKey) throw Error('Use the full console link for this room.');
  try{return await crypto.subtle.importKey('jwk',await decrypt(await aesKey(secret),meta.lockedKey),rsa,false,['decrypt']);}
  catch{throw Error('This console key does not match the room.');}
}
async function seal(value) {
  const raw=crypto.getRandomValues(new Uint8Array(32));
  const aes=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt']);
  const publicKey=await crypto.subtle.importKey('jwk',room.meta.publicJwk,rsa,false,['encrypt']);
  const packet=await encrypt(aes,value);
  return {...packet,key:b64(await crypto.subtle.encrypt(rsa,publicKey,raw))};
}
async function unseal(packet) {
  if(packet.sample) return packet.sample;
  const raw=await crypto.subtle.decrypt(rsa,privateKey,unb64(packet.key));
  const aes=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
  return decrypt(aes,packet);
}

function databaseUrl(path) {
  const base=new URL(FIREBASE_CONFIG.databaseURL);
  base.pathname=base.pathname.replace(/\/$/,'')+`/${dbRoot}/${path.split('/').map(encodeURIComponent).join('/')}.json`;
  return base;
}
async function request(path,options={}) {
  const res=await fetch(databaseUrl(path),{cache:'no-store',signal:AbortSignal.timeout(12000),...options});
  if(!res.ok && res.status!==412) throw Error(res.status===401 || res.status===403?'Firebase denied access to this room. Check the turkeyWeek rules.':`Couldn't reach the room (${res.status}).`);
  return res;
}
function demoRoom() {
  try{return JSON.parse(localStorage.getItem(demoPrefix+code));}catch{return null;}
}
function demoChange(path,value) {
  if(!path.length) {localStorage.setItem(demoPrefix+code,JSON.stringify(value));return;}
  const root=demoRoom();
  if(!root) throw Error('This rehearsal room is missing.');
  let node=root;
  for(const segment of path.slice(0,-1)) node=node[segment]??={};
  if(value===null) delete node[path.at(-1)];
  else node[path.at(-1)]=value;
  localStorage.setItem(demoPrefix+code,JSON.stringify(root));
}
const sdkRoot = () => sdkDb.ref(`${dbRoot}/${code}`);
async function loadSdk() {
  const base='https://www.gstatic.com/firebasejs/12.19.0/';
  for(const name of ['firebase-app-compat.js','firebase-database-compat.js']) {
    await new Promise((resolve,reject)=>{
      const script=document.createElement('script');
      script.src=base+name; script.onload=resolve; script.onerror=()=>reject(Error('Could not load the Firebase host console.')); document.head.append(script);
    });
  }
  sdkDb=firebase.initializeApp(FIREBASE_CONFIG).database();
  sdkDb.ref('.info/serverTimeOffset').on('value',snapshot=>{difference=Number(snapshot.val()) || 0;});
}
function ownPlayer(data) { return data?.players?.[pid] || null; }
async function pathRead(parts) {
  if(demo) return parts.reduce((value,part)=>value?.[part],demoRoom()) || null;
  return (await request([code,...parts].join('/'))).json();
}
async function compareUpdate(parts,change) {
  if(demo) {
    const value=parts.reduce((node,part)=>node?.[part],demoRoom()) ?? null;
    const next=change(clone(value));
    demoChange(parts,next);
    return next;
  }
  const path=[code,...parts].join('/');
  for(let attempt=0;attempt<5;attempt++) {
    const read=await request(path,{headers:{'X-Firebase-ETag':'true'}});
    const tag=read.headers.get('etag');
    if(!tag) throw Error('Firebase did not provide a write version.');
    const value=change(await read.json());
    const write=await request(path,{method:'PUT',headers:{'Content-Type':'application/json','if-match':tag},body:JSON.stringify(value)});
    if(write.status!==412) return write.json();
  }
  throw Error('Another device is updating this entry. Try again in a moment.');
}
async function hostPatch(changes) {
  if(demo) {
    for(const [path,value] of Object.entries(changes)) demoChange(path.split('/'),value);
    room=demoRoom();
  } else {
    await sdkRoot().update(changes);
    room=(await sdkRoot().get()).val();
  }
}
async function poll() {
  if(!code || host || pending) return;
  try {
    const latest=await pathRead([]);
    if(pending) return;
    if(latest) {
      room=showcase?sampleCrowd(latest,clock()):latest;
      if(queued().length && current()) await flushMarks();
    }
    renderIfChanged();
  } catch(error) { if(!room) problem(error.message); }
}
function patchPlayer(value) {
  if(!room.players) room.players={};
  room.players[pid]=value;
}
async function playerUpdate(change,activity=true) {
  const value=await compareUpdate(['players',pid],p=>{
    if(!p) throw Error('Join this room first.');
    change(p);
    const day=activity?featherDay(room,clock()):-1;
    if(day>=0 && room.meta.kind==='kidsTable') (p.feathers??={})[day]=true;
    return p;
  });
  patchPlayer(value);
  return value;
}

function urlFor(path={}) {
  const url=new URL(location.href);
  url.search=''; url.hash='';
  if(demo || path.demo) url.searchParams.set('demo','1');
  for(const [k,v] of Object.entries(path)) if(k!=='demo' && k!=='key' && v) url.searchParams.set(k,v);
  if(path.key) url.hash=`key=${path.key}`;
  return url.href;
}

async function copy(text,share=false) {
  if(share && navigator.share) {
    try{await navigator.share({text});return;}catch(error){if(error.name==='AbortError') return;}
  }
  try{await navigator.clipboard.writeText(text);}catch {
    const field=document.createElement('textarea');field.value=text;document.body.append(field);field.select();
    const ok=document.execCommand('copy');field.remove();if(!ok) throw Error('Could not copy on this device.');
  }
  toast('Copied');
}
function download(name,content,type='text/plain') {
  const link=document.createElement('a');
  const url=content.startsWith('data:')?content:URL.createObjectURL(new Blob([content],{type}));
  link.href=url;link.download=name;link.click();
  if(!url.startsWith('data:')) setTimeout(()=>URL.revokeObjectURL(url),1000);
}

}

function todayTasks(time,p=current()||{}) {
  const phase=surveyPhase(room,time), round=activeRound(room,time), bPhase=bingoPhase(room,time);
  const tasks=[];
  if(phase==='survey') tasks.push(['Answer the team survey',Boolean(p.survey?.submitted),'survey']);
  if(phase==='board') {const s=surveyStats(room,p,time);tasks.push(['Play the Survey Says boards',s.total>0 && s.completed===s.total,'survey']);}
  if(round>=0) tasks.push([`Vote in ${round===0?'Round 1':`the ${ROUNDS[round]}`}`,MATCHES[round].every(id=>p.sides?.votes?.[id]),'sides']);
  if(bPhase==='mark') tasks.push(['Mark your Bingo card',list(p.bingo?.marks).some(mark=>mark.on && featherDay(room,mark.at)===featherDay(room,time)),'bingo']);
  if(round>=2) tasks.sort((a,b)=>Number(a[2]==='survey')-Number(b[2]==='survey'));
  return tasks.slice(0,2);
}

const REHEARSAL_NAMES=['Priya','Jordan','Alex','Morgan','Riley'];
const EXAMPLE_BOARDS=[['Green bean casserole','Candied yams','Cranberry sauce'],['Take a nap','Watch football','Do the dishes'],['Burn the rolls','The turkey runs late','Run out of oven space'],['Traffic','Overslept','Wrong turn'],['Tech support','Cooking','Setting the table'],['Turkey','Stuffing','Cranberry sauce'],['At the beach','Home','New York'],['Family','Friends','A quiet moment']];
const SAMPLE_SLOTS=EXAMPLE_BOARDS.map((labels,i)=>({prompt:i+1,slots:labels.map((label,j)=>({label,count:[5,4,3][j],aliases:i===4&&j===0?['computer','Wi-Fi','printer','phone','TV remote']:i===1&&j===0?['nap','sleep']:i===0&&j===0?['green beans']:[]}))}));
function sampleCrowd(data,time) {
  const room=clone(data), schedule=room.meta.schedule;
  room.players??={};room.survey.answers??={};
  REHEARSAL_NAMES.forEach((name,i)=>{
    const join=schedule.launch+i*1800000;
    if(time<join) return;
    const id=`sim${i}`;
    const p={name,joined:join,bingo:{card:Array.from({length:25},(_,j)=>j===12?'free':Object.keys(POOL)[(j+i*4)%48])},sides:{picks:{},votes:{}},survey:{plays:{}}};
    const marks={},history={};
    for(const [j,square] of p.bingo.card.entries()) {
      const at=schedule.bingoOpen+i*3*HOUR+j*3*HOUR;
      if(square!=='free'&&time>=at) marks[square]=history[`m${j}`]={id:square,on:true,at,order:j};
    }
    p.bingo.marks=marks;p.bingo.history=history;
    const pWinners={};
    MATCHES.forEach((round,r)=>round.forEach((match,j)=>{pWinners[match]=pairFor(r,j,pWinners)[(i+j+r)%2];}));
    if(time>=join+1200000) p.sides.picks=pWinners;
    MATCHES[0].forEach((match,j)=>{if(time>=join+1800000) p.sides.votes[match]={dish:pairFor(0,j,{})[(i+j)%2],at:join+1800000};});
    if(time>=schedule.boardOpen+i*2*HOUR && room.survey.boards) {
      surveyBoards(room).forEach((board,j)=>{
        if(i>1&&j>i) return;
        p.survey.plays[board.index]={start:schedule.boardOpen+i*2*HOUR+j*45000,finished:true,advanced:true,guesses:[{slot:(i+j)%3}]};
      });
    }
    p.feathers=Object.fromEntries(schedule.days.flatMap((day,j)=>time>=day+15*HOUR&&j<=i+1?[[j,true]]:[]));
    room.players[id]=p;
  });
  for(let i=0;i<12;i++) {
    const at=schedule.launch+HOUR+i*HOUR;
    if(time>=at || time>=schedule.surveyClose) room.survey.answers[`demo${i}`]={at,sample:Object.fromEntries(EXAMPLE_BOARDS.map((labels,j)=>[j,labels[i<5?0:i<9?1:2]]))};
  }
  for(let r=1;r<4;r++) {
    const {winners}=voteResults(room,roundEnd(room,r-1));
    REHEARSAL_NAMES.forEach((_,i)=>{
      const p=room.players[`sim${i}`],at=roundEnd(room,r-1)+(i+1)*HOUR;
      if(!p || time<at) return;
      MATCHES[r].forEach((match,j)=>{p.sides.votes[match]={dish:pairFor(r,j,winners)[(i+j+r)%2],at};});
    });
  }
  return room;
}

async function flushMarks() {
  if(flushPromise || !queued().length) return flushPromise;
  flushPromise=(async()=>{
    while(queued().length) {
      if(bingoPhase(room,clock())!=='mark') {local.remove(queueKey());toast('The cards locked before the remaining marks could sync.');break;}
      const batch=queued();
      try {
        await playerUpdate(p=>{
          const bingo=p.bingo;
          bingo.marks??={};bingo.history??={};
          batch.forEach((move,i)=>{
            if(!list(bingo.card).includes(move.id) || bingo.history[move.token]) return;
            const entry={id:move.id,at:stamp(),on:move.on,order:move.order+i/100};
            bingo.history[move.token]=entry;bingo.marks[move.id]=entry;
          });
        });
        const sent=new Set(batch.map(move=>move.token));
        local.set(queueKey(),queued().filter(move=>!sent.has(move.token)));
        if(syncingStatus) {toast('Bingo marks synced.');syncingStatus='';}
      } catch {
        if(!syncingStatus) {syncingStatus='offline';toast('Bingo marks saved on this device. They’ll sync when you reconnect.');}
        break;
      }
    }
    renderIfChanged();
  })().finally(()=>{flushPromise=null;});
  return flushPromise;
}

async function playBoard(type,text='') {
  if(surveyPhase(room,clock())!=='board') throw Error('The survey boards are closed.');
  const board=boardPosition(clock());
  if(!board) return;
  let guess;
  if(type==='guess') {
    const label=text.trim().slice(0,60);
    if(!normalize(label)) throw Error('Type a guess first.');
    const hash=await digest(normalize(label));
    const slot=matchSlot(label,list(board.slots));
    const existing=current().survey?.plays?.[board.index];
    if(list(existing?.guesses).some(item=>item.hash===hash)) throw Error('You already tried that guess.');
    guess={hash,slot,...(slot<0?{miss:await seal(label)}:{})};
  }
  await playerUpdate(p=>{
    const play=surveyPlay(p,board.index), now=clock(), state=boardState(board,play,room.survey.appeals?.[board.index],now);
    if(type==='board-start' && !play.start) play.start=stamp();
    if(type==='board-next' && state.over) {play.finished=true;play.advanced=true;}
    if(type==='guess' && play.start && !state.over && !list(play.guesses).some(item=>item.hash===guess.hash)) {
      play.guesses=[...list(play.guesses),guess];
      if(boardState(board,play,room.survey.appeals?.[board.index],now).over) play.finished=true;
    }
  });
}

function publishDraft(values) {
  return importPreview.flatMap(board=>{
    if(values.has(`drop${board.index}`)) return [];
    const slots=list(board.slots).map((slot,i)=>{
      const id=`${board.index}_${i}`;
      return {...slot,label:values.get(`label${id}`),aliases:values.get(`aliases${id}`).split(',').map(word=>word.trim()).filter(Boolean),dest:values.get(`merge${id}`)};
    });
    const kept=slots.map((slot,i)=>slot.dest==='keep'?{label:slot.label,count:slot.count,aliases:[...slot.aliases],source:i}:null);
    slots.forEach(slot=>{
      if(['keep','drop'].includes(slot.dest)) return;
      const target=kept[Number(slot.dest)];
      if(!target) throw Error('Merge an answer into a slot marked “Keep this answer.”');
      target.count+=slot.count;target.aliases.push(slot.label,...slot.aliases);
    });
    return [{prompt:board.index+1,slots:kept.filter(Boolean)}];
  });
}
async function loadAppeals() {
  const candidates=encryptedMisses().filter(g=>!Number.isInteger(room.survey.appeals?.[g.index]?.[g.hash]));
  const unique=Object.fromEntries(candidates.map(guess=>[`${guess.index}:${guess.hash}`,guess]));
  const entries=await Promise.all(Object.entries(unique).map(async ([id,value])=>{
    const text=await unseal(value.miss).catch(()=>null);return text?[id,{...value,text}]:null;
  }));
  hostAppeals=Object.fromEntries(entries.filter(Boolean));
  if(!Object.keys(hostAppeals).length) toast('No missed guesses to review yet.');
}
function setView(value) {
  openView=value;local.set(`view:${host?'host:':''}${code}`,value);
  renderIfChanged(true);app.scrollIntoView({block:'start'});
}
function switchClock(time) {
  debugFixed=time;debugBase=Date.now();debugOffset=0;
  if(demo) local.set('clock',time);
  if(showcase) room=sampleCrowd(demoRoom(),clock());
  renderIfChanged(true);
}
function renderIfChanged(force=false) {
  const time=clock(), appHadFocus=app.contains(document.activeElement), previous=document.activeElement;
  const formInput=appHadFocus && previous.matches('input:not([type=checkbox]),textarea,select');
  const value=formInput?previous.value:null;
  const top=$('#top-actions');
  const isFinal=room && !host && current() && time>=currentReveal();
  const topHtml=room && current() && !host?`<span>${h(current().name)}${room.meta.kind==='kidsTable'?` · <b>${num(rankings(room,'kidsTable',time,isFinal).find(row=>row.id===pid)?.points||0)} GP</b>`:''}</span>${isFinal&&room.meta.kind==='kidsTable'?BTN('Results','view','gold','data-value="reveal"'):''}`:`<a href="${h(urlFor(host?{}:{role:'host'}))}">${host?'Player home':'Host console'}</a>`;
  if(top.innerHTML!==topHtml) top.innerHTML=topHtml;
  if(!$('#debug').innerHTML) $('#debug').innerHTML=debugHtml();
  document.body.className=room?`theme-${room.meta.kind}`:'';
  let content;
  if(host) content=room?hostView(time):hostStart();
  else if(!code) content=landing();
  else if(!room) {problem('Check the code or ask your host for a new link.');return;}
  else if(!current()) content=joinView();
  else if(isFinal && (room.meta.kind!=='kidsTable'||!openView||openView==='reveal')) content=reveal(time);
  else content={table:hub,bingo:bingoView,survey:surveyView,sides:sidesView}[getGame()](time);
  const html=content+`<footer class="footer"><a href="${h(urlFor())}">Thanksgiving Week</a>${demo?' · Rehearsal mode':''}</footer>`;
  if(!force && html===lastHtml) return;
  if(!force && pending) return;
  if(!force && host && formInput) return;
  if(!force && formInput && previous.name==='guess' && content.includes('data-form="guess"')) return;
  lastHtml=html;app.innerHTML=html;app.setAttribute('aria-busy','false');
  if(formInput && !force) {
    const field=[...app.querySelectorAll('input,textarea,select')].find(el=>el.name===previous.name);
    if(field && ['answer','name','initial','code'].includes(field.name)) {field.value=value;field.focus({preventScroll:true});}
  }
}
function timeTick() {
  if(!room || !current() || host || getGame()!=='survey' || !$('#clock')) return;
  const play=current().survey?.plays?.[boardPosition(clock())?.index];
  if(!play?.start || play.finished) return;
  const left=Math.max(0,Math.ceil((play.start+40000-clock())/1000));
  if(left) $('#clock').textContent=`${left}s`;
  else renderIfChanged();
}
function frameTick() {
  if(!room || pending) return;
  const time=clock();
  if($('#debug-time')) $('#debug-time').textContent=fmt(time);
  const phase=[bingoPhase(room,time),surveyPhase(room,time),activeRound(room,time),time>=currentReveal(),featherDay(room,time),time>=room.meta.schedule.launch].join(':');
  if(phase!==lastPhase) {lastPhase=phase;if(showcase) room=sampleCrowd(demoRoom(),time);renderIfChanged();}
}
async function busy(task) {
  if(pending) return;
  pending=true;
  try {await task();}
  catch(error) {toast(error.message || 'That did not go through. Try again.');pending=false;return;}
  pending=false;renderIfChanged(true);
}
async function hostClick(action,value) {
  const time=clock();
  if(action==='copy-post') return copy(postText(value,time));
  if(action==='qr') return download(`turkey-week-${code}.png`,QR.png(invite()));
  if(action==='console-copy') return copy(consoleUrl());
  if(action==='export-answers') return exportAnswers();
  if(action==='appeals') return loadAppeals();
  if(action==='sample-boards') {importPreview=cleanBoards(SAMPLE_SLOTS,12);return;}
  if(action==='bingo-close' && confirm('Lock all Bingo cards now?')) return hostPatch({'bingo/closedAt':time});
  if(action==='survey-close' && confirm('Close Survey Says now?')) return hostPatch({'survey/closedAt':time});
  if(action.startsWith('round-')) {
    const round=activeRound(room,time);
    if(round<0) return;
    const ends=ROUNDS.map((_,i)=>roundEnd(room,i));
    if(action==='round-close') {
      if(!confirm(`Close ${ROUNDS[round]} and advance the winners?`)) return;
      ends[round]=time;
    } else {
      ends[round]+=12*HOUR;
      for(let i=round+1;i<ends.length;i++) if(ends[i]<=ends[i-1]) ends[i]=ends[i-1]+12*HOUR;
    }
    await hostPatch({'sides/roundEnds':ends});
  }
}
function scheduleTime(value) { const [date,hm]=value.split('T'),[hour,minute]=hm.split(':').map(Number);return easternTime(date,0,hour,minute); }
async function hostSubmit(type,values) {
  const time=clock();
  if(type==='create') return createRoom(values);
  if(type==='schedule') {
    const s={...room.meta.schedule};
    for(const name of ['launch','surveyClose','boardOpen','bingoOpen','close','reveal']) s[name]=scheduleTime(values.get(name));
    s.rounds=ROUNDS.map((_,r)=>scheduleTime(values.get(`round${r}`)));
    if(!(s.launch<s.surveyClose && s.surveyClose<s.boardOpen && s.boardOpen<s.close && s.launch<=s.bingoOpen && s.bingoOpen<s.close && s.close<s.reveal && s.rounds.every((end,i)=>end>(s.rounds[i-1]??s.launch)&&end<=s.reveal))) throw Error('Check that the open, close and reveal times are in order.');
    const p=easternParts(s.launch), day=`${p.year}-${p.month}-${p.day}`, baseline=defaultSchedule(day);
    const daysDelta=Math.round((Date.parse(`${day}T00:00:00Z`)-Date.parse(`${easternLabel(room.meta.schedule.launch).slice(0,10)}T00:00:00Z`))/DAY);
    s.days=baseline.days;
    s.extensionSurvey=Math.max(s.surveyClose+2*DAY,baseline.extensionSurvey);
    s.extensionBoard=Math.max(s.boardOpen+2*DAY,baseline.extensionBoard);
    s.extensionClose=Math.max(s.close+2*DAY,s.extensionBoard+DAY);
    s.extensionReveal=Math.max(s.reveal+2*DAY,s.extensionClose+HOUR);
    await hostPatch({'meta/schedule':s,...(room.sides&&daysDelta?{'sides/roundEnds':null}:{})});toast('Schedule saved.');return;
  }
  if(type==='pool' && bingoPhase(room,time)==='preview') {
    await hostPatch(Object.fromEntries(Object.keys(room.bingo.pool).map(id=>[`bingo/pool/${id}/text`,values.get(id).trim()])));toast('Bingo pool saved.');return;
  }
  if(type==='dishes'&&time<room.meta.schedule.launch) {
    const dishes=Object.fromEntries(Object.entries(room.sides.dishes).map(([id,d])=>[id,{...d,name:values.get(id).trim(),caseFor:values.get(`${id}-case`).trim()}]));
    await hostPatch({'sides/dishes':dishes,'sides/regions':REGIONS.map((_,i)=>values.get(`region${i}`).trim())});toast('Lineup saved.');return;
  }
  if(type==='prompts'&&time<room.meta.schedule.launch) {
    await hostPatch({'survey/prompts':PROMPTS.map((_,i)=>values.get(`p${i}`).trim())});toast('Prompts saved.');return;
  }
  if(type==='import') {
    let raw;
    try{raw=JSON.parse(values.get('boards').trim().replace(/^```(?:json)?\s*|\s*```$/g,''));}catch{throw Error('Paste a valid JSON array of boards.');}
    importPreview=cleanBoards(raw,countSurvey(room,surveyTimes(room).surveyClose));
    if(!importPreview.length) {importPreview=null;throw Error('No prompts have three repeated answers.');}return;
  }
  if(type==='publish') {
    if(room.survey.boards || (surveyPhase(room,time)!=='sorting'&&!demo)) throw Error('Boards can be published after the survey closes.');
    const boards=cleanBoards(publishDraft(values),demo?Math.max(12,countSurvey(room)):countSurvey(room,surveyTimes(room).surveyClose));
    if(!boards.length) throw Error('Keep at least one board with three repeated answers.');
    await hostPatch({'survey/boards':boards,'survey/publishedAt':time});importPreview=null;toast('Boards published.');return;
  }
  if(type==='appeal'&&surveyPhase(room,time)==='board') {
    const id=values.get('hash'), appeal=hostAppeals[id], slot=Number(values.get('slot'));
    if(!appeal) return;
    await hostPatch({[`survey/appeals/${appeal.index}/${appeal.hash}`]:slot});delete hostAppeals[id];toast('Appeal accepted. Scores recalculated.');
  }
}
async function clickAction(action,value) {
  if(action==='jump') return switchClock(Number(value));
  if(action==='view') {
    if(!room) location.assign(urlFor({room:'DEMO24',demo:'1',game:value}));
    else setView(value);
    return;
  }
  if(action==='bingo-tab') {bingoTab=value;local.set(`bingo-tab:${code}`,value);return renderIfChanged(true);}
  if(action==='sides-tab') {sideTab=value;local.set(`sides-tab:${code}`,value);return renderIfChanged(true);}
  if(action==='region') {bracketRegion=Number(value);local.set(`region:${code}`,bracketRegion);return renderIfChanged(true);}
  if(host) return busy(()=>hostClick(action,value));
  if(action==='mark') return marker(value);
  if(action==='resume') {
    const pair=Object.entries(room.players).find(([,p])=>p.name===nameClash);
    if(pair) {
      if(showcase && /^sim/.test(pair[0])) throw Error('That name belongs to a simulated player. Choose “No, add an initial” to join the rehearsal.');
      saveJoin(pair[0],pair[1].name);setView(openView||modeOf(room.meta.kind));
    }return;
  }
  if(action==='initial') {
    requestedInitial=nameClash;nameClash='';
    renderIfChanged(true);
    $('#join-panel input').focus();return;
  }
  if(action==='share') return copy(shareCard(getGame(),clock()),true);
  if(action==='calendar') return calendar(clock()<room.meta.schedule.surveyClose?room.meta.schedule.boardOpen:surveyTimes(room).boardOpen);
  if(action==='survey-back') {
    const field=$('form[data-form=survey] input'),draft=local.get(draftKey(),{index:0,answers:{}});
    draft.answers[draft.index]=field?.value||'';draft.index=Math.max(0,draft.index-1);local.set(draftKey(),draft);return renderIfChanged(true);
  }
  if(action==='survey-skip') return busy(()=>fillSurvey(''));
  if(action==='redeal') return busy(async()=>{
    if(bingoPhase(room,clock())!=='preview') throw Error('Re-deals end when marking opens.');
    const card=deal(room.meta.kind);await playerUpdate(p=>{if(!p.bingo.redealt){p.bingo={card,redealt:true};}},false);
  });
  if(action==='pick'||action==='vote') return busy(()=>selectDish(action,value));
  if(action==='board-start'||action==='board-next') {await busy(()=>playBoard(action));$('form[data-form=guess] input')?.focus();}
}
document.addEventListener('click',event=>{
  const button=event.target.closest('button[data-act]');
  if(!button||button.disabled) return;
  clickAction(button.dataset.act,button.dataset.value).catch(error=>toast(error.message));
});
app.addEventListener('input',event=>{
  if(event.target.name!=='answer') return;
  const draft=local.get(draftKey(),{index:0,answers:{}});
  draft.answers[draft.index]=event.target.value;local.set(draftKey(),draft);
});
app.addEventListener('submit',event=>{
  const form=event.target,type=form.dataset.form;
  if(!type) return;
  event.preventDefault();
  const values=new FormData(form);
  if(type==='find') {location.assign(urlFor({room:codeOf(values.get('code'))}));return;}
  if(host) {busy(()=>hostSubmit(type,values));return;}
  if(type==='join'||type==='initial') {
    const initial=String(values.get('initial')||'').trim();
    if(type==='initial'&&!/^\p{L}$/u.test(initial)) {toast('Enter one letter for your last initial.');return;}
    busy(()=>join(type==='join'?values.get('name'):`${requestedInitial} ${initial.toUpperCase()}.`));return;
  }
  if(type==='survey') {busy(()=>fillSurvey(values.get('answer'))).then(()=>$('form[data-form=survey] input')?.focus());return;}
  if(type==='guess') busy(()=>playBoard('guess',values.get('guess'))).then(()=>$('form[data-form=guess] input')?.focus());
});

async function boot() {
  $('#brand').innerHTML=icon('kidsTable')+'Thanksgiving Week';$('#brand').href=urlFor();
  if(host && !demo) await loadSdk();
  if(showcase && !demoRoom()) {
    const secret=randomHex(32), schedule=defaultSchedule();
    const data=roomData('kidsTable',schedule,await roomCredentials(secret));
    data.survey.boards=cleanBoards(SAMPLE_SLOTS,12);
    demoChange([],data);
  }
  if(code) {
    room=host&&!demo?(await sdkRoot().get()).val():await pathRead([]);
    if(!room) throw Error('This room code was not found.');
    if(showcase) room=sampleCrowd(room,clock());
    if(host) {
      privateKey=await unlock(room.meta,key);
      if(!demo) sdkRoot().on('value',snapshot=>{if(snapshot.exists()){room=snapshot.val();renderIfChanged();}},error=>toast(error.message));
    } else {
      const view=params.get('game');
      if(GAMES.includes(view)) openView=view;
      bingoTab=local.get(`bingo-tab:${code}`,'card');sideTab=local.get(`sides-tab:${code}`,'');bracketRegion=local.get(`region:${code}`,0);
      refreshTimer=setInterval(()=>{if(!document.hidden) poll();},pollMs);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden){poll();frameTick();}});
      window.addEventListener('online',poll);
      if(queued().length&&current()) flushMarks();
    }
  }
  if(demo) window.addEventListener('storage',event=>{
    if(event.key!==demoPrefix+code || pending || !code) return;
    if(host) {room=demoRoom();renderIfChanged();}else poll();
  });
  $('#debug').innerHTML=debugHtml();renderIfChanged(true);
  setInterval(timeTick,250);setInterval(frameTick,2000);
}
boot().catch(error=>problem(error.message));
